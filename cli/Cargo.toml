[package]
name = "cdrca"
version = "0.2.2"
edition = "2021"
description = "CLI, package manager, and build tool for the CDRCA animation DSL"
license = "IOSL"

[[bin]]
name = "cdrca"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
semver = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
indicatif = "0.17"
tempfile = "=3.15.0"
uuid = { version = "=1.11.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "=2.4.1"
idna = "=0.5.0"
hashbrown = "=0.14.5"
indexmap = "=2.5.0"
# Pinned for compatibility with older rustc toolchains (e.g. distro-packaged
# Rust on Linux dev/CI environments that don't run `rustup`) — newer
# releases of this crate require a Cargo edition/rustc version this repo
# doesn't otherwise need. Safe to bump once the minimum supported rustc
# for local dev is raised deliberately; see docs/ARCHITECTURE.md's
# "Building on Linux" section for the reasoning and how to re-check this.
encoding_rs = "=0.8.35"
getrandom = "=0.2.15"

# Windows Credential Manager backed token storage
[target.'cfg(windows)'.dependencies]
keyring = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
