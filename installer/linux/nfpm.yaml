# Native Linux packages (.deb and .rpm) for the cdrca CLI, built by nfpm from
# the already-built release binary. See .github/workflows/linux-installer.yml.
#
# Expects, relative to the repo root (the workflow stages these):
#   stage/cdrca                 the release binary
#   stage/LICENSE.md
#   stage/cdrca-extension.vsix  the VS Code extension
# plus the logo, launcher and file-type files under installer/linux/ (icons/,
# cdrca.desktop, cdrca-mime.xml), which nfpm reads straight from the repo.
# and the environment variable VERSION (from cli/Cargo.toml).
#
# Unlike installer/linux/install.sh (per-user, ~/.local), these install
# system-wide (/usr/bin) and are installed, upgraded and removed by the
# distro's own package manager. Nothing here edits shell startup files.

name: cdrca
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: devel
priority: optional
# Placeholder contact: a Debian package needs a maintainer field. Replace it.
maintainer: "ISLAH <noreply@islah.invalid>"
description: |
  CLI, package manager, and build tool for the CDRCA animation DSL.
  Create, run and package CDRCA projects, and install CDRCA packages.
homepage: https://github.com/MrGrimJoe/cdrca-ready-for-the-real-world
license: IOSL

contents:
  - src: stage/cdrca
    dst: /usr/bin/cdrca
    file_info:
      mode: 0755
  - src: stage/LICENSE.md
    dst: /usr/share/doc/cdrca/LICENSE.md
  - src: stage/cdrca-extension.vsix
    dst: /usr/share/cdrca/cdrca-extension.vsix
  # --- CDRCA logo: launcher icon and .cdrca file-type icon ---
  # Same mark the Windows installer uses. The Windows installer also shows it
  # on the .cdrca file type; here that is text-x-cdrca (see cdrca-mime.xml).
  - src: installer/linux/icons/cdrca-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/cdrca.png
  - src: installer/linux/icons/cdrca-48.png
    dst: /usr/share/icons/hicolor/48x48/mimetypes/text-x-cdrca.png
  - src: installer/linux/icons/cdrca-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/cdrca.png
  - src: installer/linux/icons/cdrca-64.png
    dst: /usr/share/icons/hicolor/64x64/mimetypes/text-x-cdrca.png
  - src: installer/linux/icons/cdrca-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/cdrca.png
  - src: installer/linux/icons/cdrca-128.png
    dst: /usr/share/icons/hicolor/128x128/mimetypes/text-x-cdrca.png
  - src: installer/linux/icons/cdrca-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/cdrca.png
  - src: installer/linux/icons/cdrca-256.png
    dst: /usr/share/icons/hicolor/256x256/mimetypes/text-x-cdrca.png
  - src: installer/linux/cdrca.desktop
    dst: /usr/share/applications/cdrca.desktop
  - src: installer/linux/cdrca-mime.xml
    dst: /usr/share/mime/packages/cdrca.xml

scripts:
  postinstall: installer/linux/postinstall.sh
  postremove: installer/linux/postremove.sh

# The binary is built on Ubuntu 22.04 (glibc 2.35) and links only against
# glibc (HTTPS is rustls, not OpenSSL). Declare that floor so a package
# manager refuses to install it somewhere it would fail to start.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
  rpm:
    depends:
      - glibc >= 2.35
