name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify-all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # Everything tools/verify-all.sh lists under "Prerequisites".
      - name: Install JS dependencies
        run: |
          RT=cli/src/templates/cdrca-runtime
          npm install --no-audit --no-fund --no-save jsdom@24
          for d in "$RT" "$RT/Back-end/Transpiler/Plugins/grammar" plugins/cdrca-reactive-state plugins/ember plugins/campfire; do
            (cd "$d" && npm install --no-audit --no-fund)
          done
          (cd "$RT" && npm install --no-audit --no-fund --no-save jsdom@24)
          (cd plugins/cdrca-reactive-state && npm install --no-audit --no-fund --no-save jsdom@24)

      # Runs every check in the repo (cargo test, the grammar/plugin/runtime
      # suites, ember and campfire, the docs and corpus checks) and fails the
      # job if any step fails. All steps run, so one run shows every failure.
      - name: Verify
        id: verify
        continue-on-error: true
        run: bash tools/verify-all.sh 2>&1 | tee verify_output.log

      - name: Commit verify log on failure (self-diagnosing)
        if: steps.verify.outcome == 'failure'
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>/dev/null || true
          git checkout -B ci-debug-logs
          cp verify_output.log "verify-${{ matrix.os }}-run${GITHUB_RUN_NUMBER}.log"
          git add -f "verify-${{ matrix.os }}-run${GITHUB_RUN_NUMBER}.log"
          git commit -m "CI debug log: verify-all failure on ${{ matrix.os }}, run ${GITHUB_RUN_NUMBER}"
          git push origin ci-debug-logs --force

      - name: Fail the job if verify actually failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
