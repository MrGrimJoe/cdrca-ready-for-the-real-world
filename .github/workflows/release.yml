name: Build CDRCA Installers

# The WINDOWS installer. Linux (deb/rpm/tar.gz/cdrca-linux-x64) is built by
# linux-installer.yml (Ubuntu 22.04, glibc 2.35 floor).
#
# On a tag push, installers.yml calls both, collects every installer into one
# "cdrca-installers-all" artifact and attaches them all to the release. This
# file only BUILDS: run on its own it leaves the "cdrca-installer-windows"
# artifact, which holds
#   - cdrca-installer.exe   the interactive Inno Setup installer. It carries the
#                           CDRCA logo twice over: as the installer's own icon
#                           and wizard banner, and installed under {app}\assets
#                           (Start Menu shortcut icon, .cdrca file-type icon).
#   - cdrca-win32-x64.exe   the bare binary the npm wrapper downloads on postinstall.
#
# The VS Code extension is not published to the Marketplace by this repo, so
# each installer bundling its .vsix IS the extension's only distribution path.
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from cli/Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -n 1)"
          if [ -z "$VERSION" ]; then echo "::error::could not read the version from cli/Cargo.toml"; exit 1; fi
          # A release tag must match the crate version, or the installer would
          # be labelled with a version the binary does not report.
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match cli/Cargo.toml version $VERSION"
                exit 1
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (for building the CLI itself)
        uses: dtolnay/rust-toolchain@stable

      - name: Build cdrca.exe (release)
        id: build_cli
        working-directory: cli
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath ..\cargo_build_output.log
          exit $LASTEXITCODE

      - name: Commit build log on failure (self-diagnosing)
        if: steps.build_cli.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item cargo_build_output.log "cargo-build-win-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "cargo-build-win-run$env:GITHUB_RUN_NUMBER.log"
          git commit -m "CI debug log: Windows cargo build failure, run $env:GITHUB_RUN_NUMBER"
          git push origin ci-debug-logs --force

      - name: Fail the job if the build actually failed
        if: steps.build_cli.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Set up Node.js (for packaging the VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package VS Code extension as .vsix
        working-directory: extension
        run: |
          npm install
          npx @vscode/vsce package --out cdrca-extension.vsix
        shell: pwsh

      - name: Download rustup-init.exe (bundled INTO the installer for end users)
        run: |
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile installer/rustup-init.exe
        shell: pwsh

      - name: Stage installer assets
        run: |
          New-Item -ItemType Directory -Force -Path installer/staged
          Copy-Item cli/target/release/cdrca.exe installer/staged/cdrca.exe
          Copy-Item installer/rustup-init.exe installer/staged/rustup-init.exe
          Copy-Item cli/src/templates/assets/cdrca-logo.png installer/staged/cdrca-logo.png
          Copy-Item installer/assets/cdrca.ico installer/staged/cdrca.ico
          Copy-Item installer/assets/wizard-image.png installer/staged/wizard-image.png
          Copy-Item installer/assets/wizard-small-image.png installer/staged/wizard-small-image.png
          Copy-Item extension/cdrca-extension.vsix installer/staged/cdrca-extension.vsix
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Compile installer.exe
        id: compile_installer
        continue-on-error: true
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\cdrca-installer.iss 2>&1 | Tee-Object -FilePath iscc_output.log
          exit $LASTEXITCODE
        shell: pwsh

      - name: Commit ISCC log on failure (self-diagnosing)
        if: steps.compile_installer.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item iscc_output.log "iscc-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "iscc-run$env:GITHUB_RUN_NUMBER.log"
          git commit -m "CI debug log: ISCC compile failure, run $env:GITHUB_RUN_NUMBER"
          git push origin ci-debug-logs --force

      - name: Fail the job if the installer actually failed to compile
        if: steps.compile_installer.outcome == 'failure'
        run: exit 1
        shell: pwsh

      - name: Raw binary (platform-suffixed, for the npm wrapper)
        shell: pwsh
        run: Copy-Item installer/staged/cdrca.exe cdrca-win32-x64.exe

      - name: Checks on the built installer
        shell: pwsh
        run: |
          $exe = "installer/output/cdrca-installer.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          $item = Get-Item $exe
          if ($item.Length -lt 1MB) { throw "$exe is only $($item.Length) bytes -- the bundled files are missing" }
          Write-Host "installer file version: $((Get-Item $exe).VersionInfo.FileVersion)"
          # The bare binary that ships beside it must report the version we built.
          $out = & ".\cdrca-win32-x64.exe" --version
          Write-Host $out
          if ("$out" -notmatch [regex]::Escape("${{ steps.version.outputs.version }}")) { throw "cdrca-win32-x64.exe reports '$out', expected version ${{ steps.version.outputs.version }}" }

      - name: Upload build artifact (the installer and the bare binary)
        uses: actions/upload-artifact@v4
        with:
          name: cdrca-installer-windows
          path: |
            installer/output/cdrca-installer.exe
            cdrca-win32-x64.exe
          if-no-files-found: error
          retention-days: 14
