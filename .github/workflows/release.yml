name: Build CDRCA Installers

# Runs on every tag push (e.g. v1.2.0) and can be triggered manually.
# Two independent jobs, each building and packaging its own platform end
# to end (own Rust build, own .vsix package, own asset upload) rather
# than sharing artifacts between them -- that keeps either platform free
# to fail, get re-run, or change its packaging step without touching the
# other:
#
#   - build-windows-installer: produces the interactive Inno Setup
#     installer.exe (bundles the CLI, a silent Rust toolchain install,
#     and optionally the VS Code extension), plus the raw
#     cdrca-win32-x64.exe binary the npm wrapper downloads on postinstall.
#   - build-linux-installer: produces a cdrca-installer-linux.tar.gz
#     (the CLI binary + installer/linux/install.sh + the same .vsix,
#     see that script for why it's simpler than the Windows installer),
#     plus the raw cdrca-linux-x64 binary for the npm wrapper.
#
# Neither job publishes the VS Code extension to the Marketplace --
# this repo doesn't do that separately, so each platform's .vsix build
# IS its only distribution path (bundled into that platform's installer).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for building the CLI itself)
        uses: dtolnay/rust-toolchain@stable

      - name: Build cdrca.exe (release)
        id: build_cli
        working-directory: cli
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath ..\cargo_build_output.log
          exit $LASTEXITCODE

      - name: Commit build log on failure (self-diagnosing)
        if: steps.build_cli.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item cargo_build_output.log "cargo-build-win-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "cargo-build-win-run$env:GITHUB_RUN_NUMBER.log"
          git commit -m "CI debug log: Windows cargo build failure, run $env:GITHUB_RUN_NUMBER"
          git push origin ci-debug-logs --force

      - name: Fail the job if the build actually failed
        if: steps.build_cli.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Set up Node.js (for packaging the VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package VS Code extension as .vsix
        working-directory: extension
        run: |
          npm install
          npx @vscode/vsce package --out cdrca-extension.vsix
        shell: pwsh

      - name: Download rustup-init.exe (bundled INTO the installer for end users)
        run: |
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile installer/rustup-init.exe
        shell: pwsh

      - name: Stage installer assets
        run: |
          New-Item -ItemType Directory -Force -Path installer/staged
          Copy-Item cli/target/release/cdrca.exe installer/staged/cdrca.exe
          Copy-Item installer/rustup-init.exe installer/staged/rustup-init.exe
          Copy-Item cli/src/templates/assets/cdrca-logo.png installer/staged/cdrca-logo.png
          Copy-Item installer/assets/cdrca.ico installer/staged/cdrca.ico
          Copy-Item installer/assets/wizard-image.png installer/staged/wizard-image.png
          Copy-Item installer/assets/wizard-small-image.png installer/staged/wizard-small-image.png
          Copy-Item extension/cdrca-extension.vsix installer/staged/cdrca-extension.vsix
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Compile installer.exe
        id: compile_installer
        continue-on-error: true
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cdrca-installer.iss 2>&1 | Tee-Object -FilePath iscc_output.log
          exit $LASTEXITCODE
        shell: pwsh

      - name: Commit ISCC log on failure (self-diagnosing)
        if: steps.compile_installer.outcome == 'failure'
        shell: pwsh
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>$null
          git checkout -B ci-debug-logs
          Copy-Item iscc_output.log "iscc-run$env:GITHUB_RUN_NUMBER.log"
          git add -f "iscc-run$env:GITHUB_RUN_NUMBER.log"
          git commit -m "CI debug log: ISCC compile failure, run $env:GITHUB_RUN_NUMBER"
          git push origin ci-debug-logs --force

      - name: Fail the job if the installer actually failed to compile
        if: steps.compile_installer.outcome == 'failure'
        run: exit 1
        shell: pwsh

      - name: Rename raw binary for release (platform-suffixed, for the npm wrapper)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item installer/staged/cdrca.exe cdrca-win32-x64.exe

      - name: Upload release assets
        # GitHub Releases requires a tag to attach the release to. Manual
        # workflow_dispatch runs aren't tied to a tag, so only run this step
        # on actual tag pushes; manual runs still get the artifact below.
        # cdrca-win32-x64.exe (plain binary, no installer wizard) is what
        # the npm wrapper package downloads on postinstall on Windows.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/cdrca-installer.exe
            cdrca-win32-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (also available on non-tag manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: cdrca-installer-windows
          path: installer/output/cdrca-installer.exe

  build-linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for building the CLI itself)
        uses: dtolnay/rust-toolchain@stable

      - name: Build cdrca (release)
        id: build_cli
        working-directory: cli
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee ../cargo_build_output.log

      - name: Commit build log on failure (self-diagnosing)
        if: steps.build_cli.outcome == 'failure'
        run: |
          git config user.email "ci@github-actions.local"
          git config user.name "GitHub Actions CI"
          git fetch origin ci-debug-logs 2>/dev/null || true
          git checkout -B ci-debug-logs
          cp cargo_build_output.log "cargo-build-linux-run${GITHUB_RUN_NUMBER}.log"
          git add -f "cargo-build-linux-run${GITHUB_RUN_NUMBER}.log"
          git commit -m "CI debug log: Linux cargo build failure, run ${GITHUB_RUN_NUMBER}"
          git push origin ci-debug-logs --force

      - name: Fail the job if the build actually failed
        if: steps.build_cli.outcome == 'failure'
        run: exit 1

      - name: Set up Node.js (for packaging the VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package VS Code extension as .vsix
        # Built independently here rather than shared with the Windows
        # job's artifact -- the two jobs run in parallel and don't
        # depend on each other, on purpose (see the note at the top of
        # this file). The extension itself isn't platform-specific, so
        # this just repeats the same packaging step.
        working-directory: extension
        run: |
          npm install
          npx @vscode/vsce package --out cdrca-extension.vsix

      - name: Stage installer assets
        run: |
          mkdir -p installer/linux/staged
          cp cli/target/release/cdrca installer/linux/staged/cdrca
          chmod +x installer/linux/staged/cdrca
          cp installer/linux/install.sh installer/linux/staged/install.sh
          chmod +x installer/linux/staged/install.sh
          cp LICENSE.md installer/linux/staged/LICENSE.md
          cp extension/cdrca-extension.vsix installer/linux/staged/cdrca-extension.vsix

      - name: Package cdrca-installer-linux.tar.gz
        run: |
          mkdir -p installer/linux/output
          tar czf installer/linux/output/cdrca-installer-linux.tar.gz -C installer/linux/staged .

      - name: Rename raw binary for release (platform-suffixed, for the npm wrapper)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp installer/linux/staged/cdrca cdrca-linux-x64

      - name: Upload release assets
        # Same tag/release as the Windows job's upload -- action-gh-release
        # appends to an existing release rather than replacing it, so it's
        # safe for both jobs to upload to the same tag independently.
        # cdrca-linux-x64 (plain binary, no installer script) is what the
        # npm wrapper package downloads on postinstall on Linux.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/linux/output/cdrca-installer-linux.tar.gz
            cdrca-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (also available on non-tag manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: cdrca-installer-linux
          path: installer/linux/output/cdrca-installer-linux.tar.gz
